# php-wasm-compiler — single build configuration file.
#
# All build options live here. These are also the default values used in
# silent mode (CI):
#
#   node compile/cli.mjs --quiet
#
# Without --quiet, the CLI is interactive: it lets you review/edit these
# values before running the build, with the option to save them back here.
#
# Each extension has a `mode`:
#   static — compiled directly into the main php.wasm (see
#            compile/php/Dockerfile).
#   shared — separate WASM module, loadable at runtime without rebuilding
#            the core (Kirigami plugin of type "extension", see CLAUDE.md
#            decisions 5/30/31). Needs a `source` path; build it with
#            `node compile/cli.mjs compile-extension [name]`, not the
#            default `build` command.
#   off    — extension not compiled.

php:
  # One or more PHP versions to compile (major.minor format, e.g. "8.3").
  versions:
    - '8.5'

# Fixed target for this project (see CLAUDE.md): Node.js only, JSPI only
# (no web build, no Asyncify). Not configurable here.

extensions:

  # --- WASM-side networking proxy (-lwebsocket.js / wasm_recv & co) is not
  # what @kirigami/php-wasm uses for networking — its own runtime.js
  # implements a Node-side SOCKFS proxy instead (getPHPRuntimeWithNetwork()).
  # Also: enabling it hits a real bug (wasm_recv gets dropped from the
  # final build, likely dead-code-eliminated) — see CLAUDE.md decision 22. ---
  ws_networking_proxy: { mode: 'off' }
  mysql: { mode: 'off' }


  # --- wired into compile/php/Dockerfile, static mode functional.
  # Set to match the exact extension set of the existing, known-working
  # @kirigami/php-wasm build (../kirigami/packages/php-wasm/README.md's
  # phpinfo() "Configure Command" dump) — the interface (loaded extensions,
  # public API surface) must stay identical to that build, see CLAUDE.md
  # decision 22. ---
  cli_sapi: { mode: static }
  libzip: { mode: static }
  sqlite: { mode: static }
  curl: { mode: static }
  iconv: { mode: static }
  libxml: { mode: static }
  exif: { mode: static }
  gd: { mode: static }
  mbstring: { mode: static }
  openssl: { mode: static }
  imagick: { mode: static }
  nodefs: { mode: static }
  # No external lib, no other extension dependency — pure php-src bundled
  # code like exif/mbstring above, so no reason to make it opt-in (CLAUDE.md
  # decision 41). Not part of the reference build's Configure Command
  # (decision 22), but costs nothing to add.
  sockets: { mode: static }

  # --- PECL, vendored from their own GitHub repos rather than pecl.php.net's
  # package archive (often stale there), see CLAUDE.md decision 34. ---
  yaml: { mode: static }
  # mdhtml (php-kirigami/php-mdhtml) — CommonMark+GFM via cmark-gfm (CLAUDE.md
  # decision 37). Replaces ext/cmark, which was tried both as mode: static
  # (decision 35) and mode: shared (decision 38) but dropped entirely
  # (decision 40) — not worth the maintenance cost for a markdown parser
  # the core already covers.
  mdhtml: { mode: static }
  # php-kirigami/php-jsonk (the user's own project) -- fast JSON encode/decode
  # + JSON Schema validation via vendored simdjson (decode) + yyjson (encode).
  # Hard-depends on "json" and "pcre" being loaded -- ext/json has no
  # --disable-json flag at all in PHP 8.5 (php-src's own ext/json/config.m4
  # takes no PHP_ARG_ENABLE), so it can't actually be switched off. "jsonk
  # replaces json" is done instead by flipping jsonk's own
  # "jsonk.replace_json_functions" ini default from upstream's "0" to "1" for
  # this build (see compile/php/Dockerfile's jsonk block). First C++
  # extension in this pipeline (needs a C++17 compiler); not yet build-tested
  # end-to-end.
  jsonk: { mode: static }
  # krakjoe/apcu -- shared user/opcode cache. Added as an open experiment:
  # does its cache actually persist across separate PHP.run() calls within
  # the same php-wasm runtime instance? (matrix.json's own long-standing
  # apcu note.) Not yet build-tested.
  apcu: { mode: static }
  # php-kirigami/php-navicat (the user's own project) -- native client for
  # Navicat Premium's HTTP-tunnel protocol (ntunnel_mysql.php), reusing the
  # libcurl already linked in above for the HTTP transport. Build-tested
  # (native) and validated end-to-end against a mock tunnel server; not yet
  # tried in this wasm build.
  navicat: { mode: static }
  # igbinary/igbinary -- faster binary serializer, no external lib. Also
  # becomes apcu's own default serializer for this build (apc.serializer
  # ini default flipped from "php" to "igbinary" in compile/php/Dockerfile,
  # only when this is on) — queued in CLAUDE.md decision 43, picked up now
  # that apcu's own persistence question resolved "yes".
  igbinary: { mode: static }
  # php-kirigami/php-norm (the user's own project) -- native Normalizer class
  # + normalizer_normalize()/normalizer_is_normalized() functions, wrapping
  # vendored utf8proc (no external compile/lib* target, same "vendored flat
  # source files" shape as jsonk's simdjson/yyjson). Only registers its
  # class/functions if intl (or anything else) hasn't already provided them,
  # so it's always safe to build in as static regardless of intl's own
  # mode/state. Cheap, no dependency to justify mode: shared (decision 41's
  # own reasoning) — this is the "always-useful fallback" case it describes.
  norm: { mode: static }

  # --- OFF to match the reference build's Configure Command, which shows
  # --disable-opcache / --disable-fileinfo / --disable-mbregex, and no
  # mysql/mysqli/pdo_mysql flag at all. Soap and gettext are kept under
  # mode: shared below so they can be loaded separately without rebuilding
  # the core. ---
  mbregex: { mode: static }
  opcache: { mode: static }
  bz2: { mode: static }



  # --- no Dockerfile flag of their own: compile/php/Dockerfile turns these
  # on together with "libxml" (--enable-dom --enable-simplexml
  # --enable-xmlreader --enable-xmlwriter are all bundled into the
  # WITH_LIBXML=yes block). Must always match libxml's mode above. ---
  dom: { mode: static }
  simplexml: { mode: static }
  xmlreader: { mode: static }
  xmlwriter: { mode: static }

  # --- no Dockerfile flag of their own either: bundled with "sqlite"
  # (--enable-pdo --with-pdo-sqlite are appended together with
  # --with-sqlite3 in the WITH_SQLITE=yes block). Must always match
  # sqlite's mode above. ---
  pdo: { mode: static }
  pdo_sqlite: { mode: static }

  # --- targeted (php-static-autobuilder style), not wired yet: the CLI
  # refuses any mode other than "off" for these until they have a matching
  # --enable-x/--with-x flag in the Dockerfile (and, for some, a new
  # third-party lib vendored under compile/). Keeping this long list (in
  # the spirit of php-static-autobuilder's own matrix.json, which covers
  # ~109 extensions including many PECL ones) is the point — even though
  # the current build matches a narrower reference build, the ambition is
  # every extension in this list eventually being toggleable. ---
  intl: { mode: 'off' } # requires icu.dat (30MB), see NOTICE.md
  fileinfo: { mode: 'off' }
  ffi: { mode: 'off' }
  snmp: { mode: 'off' }
  xsl: { mode: 'off' }
  
  # --- mode: shared — compiled independently via @php-wasm/compile-extension
  # into a standalone WASM side module, loadable at runtime without
  # rebuilding php.wasm (CLAUDE.md decisions 5, 30, 31). Each entry needs a
  # `source`: a path (relative to the repo root) to the extension's own
  # config.m4 + sources. Set `internal: true` for fixtures that should never
  # be assembled into a publishable @kirigami/phpext-<name> package (output
  # stays under node-builds/, not packages/). See CLAUDE.md decision 38 for
  # the packages/ npm-workspaces monorepo this now feeds. ---
  kirigami_abi_probe:
    mode: shared
    source: compile/extensions/abi-probe
    internal: true # self-test fixture proving the mode:shared pipeline works end-to-end, not a real extension

  # The real mode:shared pilot (CLAUDE.md decision 30's plan). Needs libsodium
  # vendored (compile/libsodium/, built via `make libsodium_jspi`) — vendorLib
  # tells `compile-extension` to stage that build into source/vendor/libsodium
  # and link it in; pkgConfigVar matches ext/sodium's own config.m4
  # (PKG_CHECK_MODULES([LIBSODIUM], ...)), which needs env-style overrides
  # since there's no real pkg-config/libsodium.pc inside the build container.
  sodium:
    mode: shared
    source: compile/extensions/sodium
    vendorLib: libsodium
    pkgConfigVar: LIBSODIUM

  # Off-list extensions being moved to mode: shared (CLAUDE.md decision 42) —
  # unlike sodium, these need no vendored C library at all, just php-src's own
  # bundled sources, same shape as static-mode exif/mbstring/mysql.
  ftp:
    mode: shared
    source: compile/extensions/ftp

  # GNU gettext under musl/libc's own sysroot, built as a standalone side
  # module with no vendored external library required; the source is the PHP
  # bundled gettext extension itself.
  #
  # ac_cv_lib_*: config.m4's AC_CHECK_LIB probes for bindtextdomain and the
  # ngettext family come back negative in this side-module environment, which
  # (with the unmodified upstream config.m4) is a hard configure error, and
  # with an earlier locally-patched one silently dropped ngettext()/
  # dngettext()/dcngettext()/bind_textdomain_codeset(). Every one of these is
  # genuinely present in Emscripten's musl libc.a (verified with llvm-nm), so
  # pre-seed autoconf's cache the same way pgsql does -- the core exports them
  # through .JS_ABI_EXPORTS (compile/php/Dockerfile).
  gettext:
    mode: shared
    source: compile/extensions/gettext
    configArgs: >-
      ac_cv_lib_intl_bindtextdomain=no
      ac_cv_lib_c_bindtextdomain=yes
      ac_cv_lib_c_ngettext=yes
      ac_cv_lib_c_dngettext=yes
      ac_cv_lib_c_dcngettext=yes
      ac_cv_lib_c_bind_textdomain_codeset=yes
      --with-gettext=/root/emsdk/upstream/emscripten/cache/sysroot
  
  # TODO: METTRE DES COMMENTAIRES 
  gmp:
    mode: shared
    source: compile/extensions/gmp
    vendorLib: libgmp
    pkgConfigVar: GMP
    configArgs: '--with-gmp'

  # PHP's bundled SOAP extension, compiled as its own side module so it can be
  # loaded without rebuilding the core; it depends on libxml and otherwise uses
  # only php-src's built-in sources.
  soap:
    mode: shared
    source: compile/extensions/soap
    vendorLib: libxml2
    pkgConfigVar: LIBXML
    extraCflags: -DHAVE_LIBXML=1 -I/root/php-src -I/root/php-src/ext/libxml

  # The first pair of mode:shared extensions where one depends on the other
  # being loaded first (CLAUDE.md decision 42) — mysqli needs mysqlnd's Zend
  # module already loaded (PHP_ADD_EXTENSION_DEP(mysqli, mysqlnd) in mysqli's
  # own config.m4), not just a linkable C library. `internal: true` because
  # mysqlnd is never published on its own — it's bundled into @kirigami/
  # phpext-mysqli below (one npm install, two .so + two manifests inside;
  # a real merged single .so was considered and rejected as too much C work
  # for now).
  #
  # Compression (zlib) and extended SSL (openssl) support both enabled
  # (CLAUDE.md decision 45's follow-up) — compression is mysqlnd's own
  # config.m4 default, just needs zlib to actually be findable; SSL defaults
  # off unless $PHP_OPENSSL is set (never true in this isolated build
  # container), hence the explicit --with-mysqlnd-ssl. Both libz and
  # libopenssl are already vendored/built for the static core (compile/libz/,
  # compile/libopenssl/) — vendorLibs stages both into
  # source/vendor/{libz,libopenssl} and overrides PHP_SETUP_ZLIB/
  # PHP_SETUP_OPENSSL's own PKG_CHECK_MODULES([ZLIB]/[OPENSSL], ...) probes
  # the same way sodium's pkgConfigVar already does for LIBSODIUM (both
  # macros are pkg-config-based, confirmed by reading php-src's real
  # build/php.m4).
  mysqlnd:
    mode: shared
    source: compile/extensions/mysqlnd
    configArgs: '--with-mysqlnd-ssl'
    vendorLibs:
      - lib: libz
        pkgConfigVar: ZLIB
      - lib: libopenssl
        pkgConfigVar: OPENSSL
    internal: true
  # No vendorLib: mysqli doesn't link a C library, it calls into mysqlnd's own
  # Zend module at runtime. compile/extensions/mysqli/ext/mysqlnd/ stages
  # mysqlnd's headers for the compile-time #include only — see
  # compile/extensions/mysqli/PROVENANCE.md for the full mechanism and its
  # unresolved-until-tested runtime assumption. `bundleExtensions` tells
  # cli.mjs to also build mysqlnd into this same package directory, as
  # manifest-mysqlnd.json (loaded before this package's own manifest.json).
  mysqli:
    mode: shared
    source: compile/extensions/mysqli
    bundleExtensions: [mysqlnd]

  # Second mysqlnd consumer (CLAUDE.md decision 47) -- a PDO driver, not a
  # standalone mysqlnd-calling extension like mysqli, but the same shape:
  # PHP_ADD_EXTENSION_DEP(pdo_mysql, mysqlnd) needs mysqlnd's Zend module
  # already loaded, so `bundleExtensions` reuses the same already-built,
  # internal `mysqlnd` package mysqli bundles (no second copy built).
  # `pdo` itself (the other PHP_ADD_EXTENSION_DEP) is already `mode: static`
  # above -- no bundling needed for it, just its headers at compile time
  # (see compile/extensions/pdo_mysql/PROVENANCE.md).
  #
  # configArgs is NOT optional here, unlike mysqlnd/mysqli's own flags:
  # pdo_mysql's config.m4 declares itself via PHP_ARG_WITH (not
  # PHP_ARG_ENABLE), defaulting to "no" -- @php-wasm/compile-extension's
  # own build script always passes --enable-<name>, which pdo_mysql's
  # config.m4 doesn't recognize at all (silently ignored by autoconf), so
  # without this the extension would build a .so that... doesn't actually
  # have PDO_MYSQL compiled in. See PROVENANCE.md for the full reasoning.
  pdo_mysql:
    mode: shared
    source: compile/extensions/pdo_mysql
    configArgs: '--with-pdo-mysql=mysqlnd'
    bundleExtensions: [mysqlnd]

  # No external lib, no configArgs needed (CLAUDE.md decision 47's follow-up):
  # @php-wasm/compile-extension's own --enable-dba default is already enough
  # to turn on exactly the three bundled-source backends (cdb, inifile,
  # flatfile) -- every other backend (qdbm/gdbm/ndbm/db1-4/dbm/tcadb/lmdb)
  # needs an external lib this repo doesn't vendor and defaults to off on
  # its own. See compile/extensions/dba/PROVENANCE.md.
  dba:
    mode: shared
    source: compile/extensions/dba

  # Batch of no-external-lib, php-src-bundled extensions (CLAUDE.md decision
  # 48's follow-up, "batch extensions + batch debugging" per the user's own
  # 2026-09-16 direction). Only posix survived: it's the one extension in
  # this batch whose functions map to real, Emscripten-implemented libc
  # calls (besides getpid, which needed its own JS-alias fix -- the main
  # module wraps it via -Wl,--wrap=getpid).
  #
  # pcntl, shmop, sysvshm, sysvmsg, and sysvsem were all tried and
  # deliberately dropped (not just "off" -- removed entirely, same as
  # ext/cmark in decision 40; see matrix.json's own `disabled: true` entries
  # for each, with the full reasoning). pcntl's entire feature set (fork(),
  # waitpid(), inter-process signals) has no real equivalent in a
  # single-instance WASM VM with no real process model. The other four all
  # depend on real SysV IPC syscalls (shmget/msgget/semget and friends)
  # that CLAUDE.md decision 43 already found Emscripten's libc declares but
  # does not implement for its own shm backend -- confirmed the same
  # afternoon to generalize to the *entire* SysV IPC family, not just
  # shm: every single one of shmat/shmget/shmctl/shmdt/msgget/msgsnd/
  # msgrcv/msgctl/semget/semop/semctl failed to even link as an exported
  # symbol, found one at a time as each was removed from a failed build in
  # turn. With none of the underlying syscalls available at all, these four
  # extensions would ship with every function permanently broken -- not
  # worth carrying as dead weight.
  posix:
    mode: shared
    source: compile/extensions/posix

  # PostgreSQL support (CLAUDE.md decision, 2026-09-22), the first pair of
  # mode:shared extensions built against a newly-vendored external C library
  # since sodium/gmp -- libpq (compile/libpq/Dockerfile). Both pgsql and
  # pdo_pgsql link libpq directly (unlike mysqli/pdo_mysql, there's no
  # mysqlnd-style shared Zend-module dependency between them -- see
  # compile/extensions/pdo_pgsql/PROVENANCE.md). configArgs is required for
  # both: their config.m4 declares itself via PHP_ARG_WITH (not
  # PHP_ARG_ENABLE), same gap decision 47 already found for pdo_mysql/gmp --
  # @php-wasm/compile-extension's own default --enable-<name> is silently
  # ignored, leaving the extension off. pkgConfigVar: PGSQL matches
  # PHP_SETUP_PGSQL's own PKG_CHECK_MODULES([PGSQL], [libpq >= 10.0], ...)
  # probe (build/php.m4) -- both extensions call this same shared macro, so
  # both get the same auto-generated PGSQL_CFLAGS/PGSQL_LIBS override (the
  # vendorLib mechanism's default raw archive-path form -- same as gmp/
  # sodium, deliberately NOT overridden to an -L/-l pair here, see below).
  #
  # ac_cv_lib_pq_<function>=yes/no: PHP_SETUP_PGSQL and pgsql's/pdo_pgsql's
  # own config.m4 each run extra PHP_CHECK_LIBRARY (= bare AC_CHECK_LIB)
  # probes on top of the PKG_CHECK_MODULES probe above -- and AC_CHECK_LIB
  # is fundamentally unreliable in this build environment: it unconditionally
  # appends a plain "-lpq" to its test link line (which the raw archive-path
  # form of PGSQL_LIBS can't satisfy -- real failure: "wasm-ld: error:
  # unable to find library -lpq"), AND, even with a -L/-l form that does
  # satisfy it, side-module WASM linking (--unresolved-symbols=import-
  # dynamic) doesn't fail on a genuinely-undefined symbol the way a normal
  # static link would -- so it reports "found" whether or not the function
  # actually exists. Concretely caught: HAVE_PG_SERVICE (PQservice) got
  # wrongly defined this way even though PQservice doesn't exist anywhere in
  # real libpq 18.6 (absent from both libpq-fe.h and the built libpq.a's
  # symbol table -- config.m4's own "PostgreSQL 18 or later" comment looks
  # ahead to an unreleased version, v19beta3 as of this writing), tripping a
  # hard "undeclared function" compile error in pgsql.c. Pre-seeding
  # autoconf's own result cache variables (`ac_cv_lib_<lib>_<func>`) instead
  # short-circuits every one of these probes without patching the vendored
  # config.m4/pgsql.c -- each is otherwise genuinely present in libpq 18.6
  # (all require PG 10-17, comfortably below 18.6) except PQservice, forced
  # to "no". See compile/extensions/pgsql/PROVENANCE.md.
  pgsql:
    mode: shared
    source: compile/extensions/pgsql
    vendorLib: libpq
    pkgConfigVar: PGSQL
    configArgs: >-
      ac_cv_lib_pq_PQencryptPasswordConn=yes
      ac_cv_lib_pq_PQresultMemorySize=yes
      ac_cv_lib_pq_PQchangePassword=yes
      ac_cv_lib_pq_PQsocketPoll=yes
      ac_cv_lib_pq_PQclosePrepared=yes
      ac_cv_lib_pq_PQsetChunkedRowsMode=yes
      ac_cv_lib_pq_PQservice=no
      --with-pgsql

  pdo_pgsql:
    mode: shared
    source: compile/extensions/pdo_pgsql
    vendorLib: libpq
    pkgConfigVar: PGSQL
    configArgs: >-
      ac_cv_lib_pq_PQencryptPasswordConn=yes
      ac_cv_lib_pq_PQresultMemorySize=yes
      ac_cv_lib_pq_PQclosePrepared=yes
      --with-pdo-pgsql

  # HTML Tidy (htacg/tidy-html5), vendored as libtidy (compile/libtidy/
  # Dockerfile, mode: static's original plan per matrix.json's own libtidy
  # note -- picked up here as mode: shared instead, same as gmp). Unlike
  # gmp/pgsql, config.m4 does its own manual directory search (test -f
  # .../include/tidy/tidy.h or .../include/tidy.h) rather than
  # PKG_CHECK_MODULES, so configArgs points --with-tidy directly at the
  # vendorLib staging path instead of a pkgConfigVar env override -- no
  # pkgConfigVar needed here at all.
  #
  # extraCflags: -DHAS_FUTIME=0 works around a real build failure --
  # tidyplatform.h's own platform auto-detection (HAS_FUTIME, gated on
  # CYGWIN_OS/LINUX_OS/__GLIBC__/etc., none of which Emscripten defines)
  # defaults to 1 for an unrecognized platform and #includes <sys/utime.h>,
  # which doesn't exist in Emscripten's sysroot (only the portable
  # <utime.h>, the HAS_FUTIME=0 branch). Forcing the macro (the header's own
  # `#ifndef HAS_FUTIME` guard allows overriding it this way) needs no patch
  # to the vendored header at all.
  tidy:
    mode: shared
    source: compile/extensions/tidy
    vendorLib: libtidy
    configArgs: '--with-tidy=/build/vendor/libtidy'
    extraCflags: -DHAS_FUTIME=0

  # OpenLDAP client libraries (liblber/libldap), vendored as openldap
  # (compile/libopenldap/Dockerfile -- client libs only, --disable-slapd,
  # no SASL/TLS yet). Unlike tidy, config.m4 tries PKG_CHECK_MODULES([LDAP],
  # [lber ldap], ...) FIRST -- pkgConfigVar's env override short-circuits
  # that probe the same way it does for gmp/pgsql, which steers config.m4
  # down its PHP_EVAL_LIBLINE branch (raw-archive-path friendly) instead of
  # its other, PHP_ADD_LIBRARY_WITH_PATH-based manual-search branch (which
  # would hit the same libtool bug bz2/tidy did) -- no config.m4 patch
  # needed here at all. --with-ldap is still required explicitly, same gap
  # as gmp/pgsql/pdo_mysql (PHP_ARG_WITH with no default, --enable-ldap
  # silently ignored). See compile/extensions/ldap/PROVENANCE.md.
  ldap:
    mode: shared
    source: compile/extensions/ldap
    vendorLib: openldap
    pkgConfigVar: LDAP
    configArgs: '--with-ldap'

  # Enchant spell-checking (CLAUDE.md decision, 2026-09-22). config.m4 has a
  # single PKG_CHECK_MODULES([ENCHANT2], [enchant-2], ...) probe --
  # pkgConfigVar's env override short-circuits it the same way as gmp/pgsql,
  # so this needed no config.m4 patch. vendorLib: libenchant2 supplies
  # ENCHANT2_LIBS automatically (its own vendored lib/ directory bundles
  # libenchant-2.a alongside libglib-2.0.a/libgmodule-2.0.a/libffi.a/libz.a
  # -- see compile/libenchant2/Dockerfile and matrix.json's own libenchant2
  # note for why: config.m4 only has the one PKG_CHECK_MODULES call to
  # override, so every transitive dependency has to already live in that
  # one vendored archive set).
  #
  # ENCHANT2_CFLAGS is re-overridden (same "later configArgs wins" ordering
  # as pgsql's own PGSQL_LIBS override) to point one level deeper than the
  # vendorLib mechanism's default: enchant.c does `#include <enchant.h>`
  # (bare, matching real enchant-2.pc's own Cflags: -I.../enchant-2), but
  # our headers are staged at include/enchant-2/enchant.h -- the default
  # `-I.../include` isn't enough on its own.
  enchant:
    mode: shared
    source: compile/extensions/enchant
    vendorLib: libenchant2
    pkgConfigVar: ENCHANT2
    configArgs: 'ENCHANT2_CFLAGS="-I/build/vendor/libenchant2/include/enchant-2" --with-enchant'

  # ODBC via the unixODBC driver manager (compile/unixodbc/Dockerfile --
  # libodbc only, no bundled drivers). config.m4 offers several mutually
  # exclusive backends (ibm-db2, custom-odbc, iodbc, unixODBC), none on by
  # default, and declares each via PHP_ARG_WITH -- so the compile-extension
  # default --enable-odbc is silently ignored, same gap as gmp/pgsql/ldap.
  # But no --with-* flag can pick the backend under phpize: build/php.m4's
  # php_always_shared forces every PHP_ARG_WITH that evaluates to "no" to
  # "yes, shared", so config.m4's first backend block (ibm-db2) always wins
  # and hard-fails looking for /home/db2inst1/sqllib/include/sqlcli1.h,
  # even with --without-ibm-db2. Pre-setting ODBC_TYPE=unixODBC skips all
  # four backend blocks (each is guarded by AS_VAR_IF([ODBC_TYPE],, ...))
  # and goes straight to the common "Extension setup" block, which defines
  # HAVE_UODBC/PHP_ODBC_TYPE and links $ODBC_LIBS -- supplied by
  # pkgConfigVar's ODBC_CFLAGS/ODBC_LIBS, same as ldap. The one define the
  # skipped unixODBC block would have set, HAVE_UNIXODBC (selects the
  # sql.h/sqlext.h includes in php_odbc_includes.h), comes from
  # extraCflags. No config.m4 patch needed. See
  # compile/extensions/odbc/PROVENANCE.md, including why an actual database
  # connection needs a driver this package does not ship.
  odbc:
    mode: shared
    source: compile/extensions/odbc
    vendorLib: unixodbc
    pkgConfigVar: ODBC
    configArgs: 'ODBC_TYPE=unixODBC ext_shared=yes'
    extraCflags: -DHAVE_UNIXODBC=1

  # PDO driver over the same unixODBC driver manager (vendorLib: unixodbc,
  # linked independently -- no Zend-module dependency on ext/odbc, unlike
  # pdo_mysql -> mysqlnd). Single PHP_ARG_WITH, so none of odbc's phpize
  # backend-selection trouble: the "flavour" in --with-pdo-odbc=unixODBC
  # picks config.m4's PKG_CHECK_MODULES([PDO_ODBC], [odbc]) branch, which
  # pkgConfigVar's env override short-circuits. `pdo` itself is mode: static
  # (headers only at compile time, same as pdo_mysql/pdo_pgsql). See
  # compile/extensions/pdo_odbc/PROVENANCE.md.
  pdo_odbc:
    mode: shared
    source: compile/extensions/pdo_odbc
    vendorLib: unixodbc
    pkgConfigVar: PDO_ODBC
    configArgs: '--with-pdo-odbc=unixODBC'

  # PDO driver for Microsoft SQL Server / Sybase over FreeTDS's db-lib
  # (compile/freetds/Dockerfile -- libsybdb only, no TLS yet). config.m4 has
  # no pkg-config branch: --with-pdo-dblib=DIR checks DIR/include/sybdb.h
  # and DIR/lib/libsybdb.a itself, so it points straight at the vendorLib
  # staging path (same shape as tidy, no pkgConfigVar). Its
  # PHP_ADD_LIBRARY_WITH_PATH call is removed from the vendored config.m4,
  # same libtool fix as tidy/bz2. See
  # compile/extensions/pdo_dblib/PROVENANCE.md.
  pdo_dblib:
    mode: shared
    source: compile/extensions/pdo_dblib
    vendorLib: freetds
    configArgs: '--with-pdo-dblib=/build/vendor/freetds'

  # PDO driver for Firebird, over Firebird 5's own client library
  # (compile/firebird/Dockerfile -- libfbclient built from the server source
  # with --enable-client-only, plus its static deps: libfbcommon, tommath,
  # tomcrypt, decFloat, re2). Same shape as pdo_dblib: no fb_config in the
  # build container, so --with-pdo-firebird=DIR takes config.m4's directory
  # branch, pointed at the vendorLib staging path; its
  # PHP_ADD_LIBRARY_WITH_PATH call is removed from the vendored config.m4
  # (same libtool fix as tidy/bz2/pdo_dblib). Its PHP_CHECK_LIBRARY
  # (AC_CHECK_LIB) probe is answered with ac_cv_lib_fbclient_* instead of
  # run, same reason as pgsql's. Also the first C++ mode:shared extension
  # (pdo_firebird_utils.cpp, and libfbclient itself is C++). See
  # compile/extensions/pdo_firebird/PROVENANCE.md.
  pdo_firebird:
    mode: shared
    source: compile/extensions/pdo_firebird
    vendorLib: firebird
    configArgs: >-
      ac_cv_lib_fbclient_fb_get_master_interface=yes
      --with-pdo-firebird=/build/vendor/firebird

# Version of each third-party library to use (see matrix.json for known
# versions + their source). "latest" = the newest entry known to
# matrix.json for that lib (NOT an automatic scrape of upstream yet — see
# CLAUDE.md decision 11, not implemented lib by lib like it is for PHP).
# An explicit version number pins that version instead.
libraries:
  libcurl: { version: latest } # 8.22.0, test-built 2026-09-12 (needed --without-libpsl, see NOTICE.md/CLAUDE.md decision 26)
  libssh2: { version: latest } # curl SFTP/SCP support, see CLAUDE.md decision 24
  nghttp2: { version: latest } # curl HTTP/2 support, see CLAUDE.md decision 25
  libgd: { version: latest }
  libImageMagick: { version: latest }
  libiconv: { version: latest }
  libjpeg: { version: latest }
  libavif: { version: latest }
  libaom: { version: latest }
  libpng16: { version: latest }
  libxml2: { version: latest }
  libwebp: { version: latest }
  libsqlite3: { version: latest }
  libz: { version: latest }
  # libzip currently builds two versions in parallel (see matrix.json) —
  # not configurable here yet. libopenssl builds a single version — see
  # build.openssl_version below.
  # oniguruma has no pinned version in its Dockerfile — "latest" doesn't
  # change anything there until that's fixed (see matrix.json).

build:
  stack_size: 1MB
  # Defaults to matrix.json's "libopenssl" latest entry (see CLAUDE.md
  # decision 27) — set an explicit version here only to override that.
  debug: false
  sourcemaps: false

output:
  # Output directory, relative to the repo root.
  dir: node-builds
