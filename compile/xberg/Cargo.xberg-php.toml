# Replaces crates/xberg-php/Cargo.toml for the wasm32-unknown-emscripten
# build (see ../extensions/xberg/PROVENANCE.md). Same package, but:
#  - a staticlib instead of a cdylib (compile-extension links the archive);
#  - only the pure-Rust document extractors: no OCR (Tesseract, Paddle,
#    Candle), no ONNX/ML models, no pdfium, no HTTP/MCP server, no URL
#    ingestion, no tree-sitter grammar pack, no LLM clients. Those need
#    native code, threads, sockets or model downloads this VM lacks, or
#    would make the module enormous. The feature set is the upstream
#    `no-ort-target` profile (its own pure-Rust base for WASM/Android),
#    plus excel-wasm and hwpx like its `wasm-target`.
#  - one `xberg` dependency instead of the per-platform tables.
[package]
name = "xberg-php"
version.workspace = true
edition = "2024"
license.workspace = true
description = "High-performance document intelligence library"
readme = false

[package.metadata.cargo-machete]
ignored = ["tokio", "ahash", "async-trait", "tracing"]

[lib]
crate-type = ["staticlib"]

[features]
extension-module = []
default = [
    "html", "pdf", "heuristics", "keywords-rake", "keywords-yake", "layout-types",
    "svg", "transcription-types", "tokio-runtime", "tree-sitter", "url-ingestion",
    "url-config-types",
]
html = ["xberg/html"]
pdf = ["xberg/pdf"]
heuristics = ["xberg/heuristics"]
keywords-rake = ["xberg/keywords-rake"]
keywords-yake = ["xberg/keywords-yake"]
layout-types = ["xberg/layout-types"]
svg = ["xberg/svg"]
transcription-types = ["xberg/transcription-types"]
tokio-runtime = ["xberg/tokio-runtime"]
tree-sitter = ["xberg/tree-sitter"]
url-ingestion = ["xberg/url-ingestion"]
url-config-types = ["xberg/url-config-types"]

[dependencies]
async-trait = "0.1"
crawlberg = { default-features = false, version = "1.8.0" }
ext-php-rs = "0.16.0"
html-to-markdown-rs = { default-features = false, version = "3.15" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
xberg = { version = "1.3.2", path = "../xberg", default-features = false, features = [
    "html", "xml", "email", "language-detection", "chunking", "chunking-tokenizers",
    "quality", "keywords-rake", "keywords-yake", "markdown-footnotes", "enrichment",
    "heuristics", "office", "iwork", "hwp", "hwpx", "mdx", "archives", "stopwords",
    "layout-types", "auto-rotate-types", "paddle-ocr-types", "presets", "redaction",
    "svg", "transcription-types", "excel-wasm", "pdf", "tokio-runtime",
    "diff", "api-types", "api", "tree-sitter", "candle-ocr", "classification",
    "late-interaction-presets", "url-ingestion", "url-config-types",
] }

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
